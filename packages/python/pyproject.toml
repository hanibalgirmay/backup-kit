[project]
name = "backup-kit"
version = "0.1.0"
description = "Python runtime for backup-kit (scaffold)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backup_kit*"]
